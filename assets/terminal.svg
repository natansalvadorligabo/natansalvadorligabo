<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-label="Terminal: what is natan shipping these days? Recent projects: mural-de-caronas-ifsp, aws-kafka-async-payments, claude-usage-meter, agents-at-work, sql-cube-lab.">
  <style>
    text { font: 14px ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, Consolas, monospace; white-space: pre; dominant-baseline: middle; }
    .line { opacity: 0; animation: show 0.3s ease-out forwards; }
    .typing { animation: type 1.6s steps(34) 0.4s forwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; transform: translateX(-4px); } to { opacity: 1; } }
    @keyframes type { to { transform: translateX(285.6px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; opacity: 1; }
      .typing { display: none; }
      .cursor { animation: none; }
    }
  </style>
