name: refresh terminal

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - package.json
      - .github/workflows/refresh-terminal.yml

permissions:
  contents: write

concurrency:
  group: refresh-terminal
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
      - name: Commit the new terminal if it changed
        run: |
          git diff --quiet -- assets/terminal.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/terminal.svg
          git commit -m "chore: redraw terminal"
          git push
